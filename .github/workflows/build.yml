name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-configuration-cache --stacktrace 2>&1 | tee build.log

      # Boots a real NeoForge server with Accessories and runs src/main/java/io/github/accslots/dev/SelfTest.
      - name: Self-test on a real server
        run: |
          mkdir -p run-selftest
          echo "eula=true" > run-selftest/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\ngenerate-structures=false\nspawn-protection=0\n' > run-selftest/server.properties
          set -o pipefail
          timeout 900 ./gradlew runSelftest --no-configuration-cache 2>&1 | tee selftest.log
          grep -q "ACCSLOTS SELFTEST PASSED" selftest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: accslots-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error

      # Rolling "latest" release with the jar, so there's always a download page.
      - name: Publish latest release
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --title "Latest build (NeoForge 1.21.1)" \
            --notes "Automatic build of ${{ github.sha }}. Drop the jar into your mods folder next to Accessories." \
            --target "${{ github.sha }}"

      # Keeps the latest build log (and jar) readable with plain git (branch "ci-logs").
      - name: Publish build log
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -f build.log ] || echo "no build log" > build.log
          cp build.log /tmp/build.log
          [ -f selftest.log ] && cp selftest.log /tmp/selftest.log || true
          mkdir -p /tmp/jars && cp build/libs/*.jar /tmp/jars/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/build.log build.log
          cp /tmp/jars/*.jar . 2>/dev/null || true
          cp /tmp/selftest.log . 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > status.txt
          git add -A
          git commit -qm "Build log for ${{ github.sha }}"
          git push -f origin ci-logs
